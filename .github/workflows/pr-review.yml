name: PR Preview Generation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Removed the strict file paths so any edit triggers this in the sandbox

permissions:
  contents: write
  pull-requests: write 

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy Preview
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
          persist-credentials: true

      - name: Build Dummy Website
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          # INSTEAD OF JEKYLL: We just make a quick dummy HTML file
          mkdir -p _site
          echo "<html><body style='font-family: sans-serif; padding: 2rem;'>" > _site/index.html
          echo "<h1>🎉 Sandbox Success!</h1>" >> _site/index.html
          echo "<p>This is a live preview for PR #<strong>${PR_NUMBER}</strong>.</p>" >> _site/index.html
          echo "<p>When you close the PR, the cleanup bot will delete this page.</p>" >> _site/index.html
          echo "</body></html>" >> _site/index.html

      - name: Deploy preview to gh-pages
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/pr-preview
          cp -r _site/. /tmp/pr-preview/

          git fetch origin gh-pages 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . --quiet
            echo "# Sandbox Pages Repo" > README.md
            git add README.md
            git commit -m "chore: initialise gh-pages branch"
          fi

          PREVIEW_DIR="pr-previews/${PR_NUMBER}"
          rm -rf "${PREVIEW_DIR}"
          mkdir -p "${PREVIEW_DIR}"
          cp -r /tmp/pr-preview/. "${PREVIEW_DIR}/"

          git add "${PREVIEW_DIR}"
          if git diff --staged --quiet; then
            echo "No changes to deploy."
          else
            COMMIT_SHA="${{ github.event.pull_request.head.sha }}"
            git commit -m "preview: PR #${PR_NUMBER} @ ${COMMIT_SHA::7}"

            for attempt in 1 2 3; do
              git fetch origin gh-pages
              git rebase origin/gh-pages 2>/dev/null || { git rebase --abort; true; }
              git push origin gh-pages && break
              echo "Push attempt ${attempt} failed, retrying..."
              sleep $((attempt * 5))
            done
          fi 

      - name: Post or update preview comment
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = process.env.PR_NUMBER;
            const sha      = context.payload.pull_request.head.sha.substring(0, 7);
            const owner    = context.repo.owner;
            const repo     = context.repo.repo;

            const previewUrl = `https://${owner}.github.io/${repo}/pr-previews/${prNumber}/`;

            const body = [
              `## 📄 Documentation Preview`,
              ``,
              `| | |`,
              `|---|---|`,
              `| **Preview URL** | ${previewUrl} |`,
              `| **Commit** | \`${sha}\` |`,
              `| **Updated** | ${new Date().toUTCString()} |`,
              ``,
              `> Preview updates automatically on every push to this PR.`,
              `> It will be removed when the PR is closed.`,
            ].join('\n');

            const marker = '<!-- pr-preview-bot -->';
            const markedBody = marker + '\n' + body;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo,
                comment_id: existing.id,
                body: markedBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: prNumber,
                body: markedBody,
              });
            }
